name: ci

on:
  # The matrix is expensive and main is the only branch that has to be green.  dev and nightly
  # run the same commands locally before a merge; they do not spend a runner per commit.
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # One script, so the gate a person runs before a merge is the gate CI runs.  The matrix
      # supplies the OS; the script supplies the commands.
      - name: the gate
        if: matrix.os != 'ubuntu-latest'
        shell: bash
        run: sh scripts/ci.sh

      # The repository checks need a clean checkout and run once, not three times.
      - name: the gate, with the repository checks
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: sh scripts/ci.sh --hygiene

      # The script cannot know which commits a push brought, and the hook is only installed in a
      # clone that opted in.  This is the same rule for a machine that never installed it.  Merge
      # and revert messages are exempt inside the hook; a push range is validated when GitHub
      # reports one, and a fresh branch falls back to the tip.
      - name: commit messages
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          base="${{ github.event.before }}"
          case "$base" in ""|0000000*) range="-1" ;; *) range="$base..HEAD" ;; esac
          for sha in $(git rev-list $range); do
            git log -1 --format=%B "$sha" > /tmp/message
            if ! sh .githooks/commit-msg /tmp/message; then
              echo "commit $sha has a message that does not conform to CONTRIBUTING.md"
              exit 1
            fi
          done

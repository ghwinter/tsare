name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release

      # The documents the tests read are there, and they compile.  One per invocation on purpose:
      # `check DIR` merges a directory into one program, and the prelude files are separate worlds.
      - run: cargo run --release --quiet -- check SELF.tsare
      - run: cargo run --release --quiet -- check docs/REPO.tsare
      - run: cargo run --release --quiet -- check prelude/KERNEL.tsare
      - run: cargo run --release --quiet -- check prelude/WORLDVIEW.tsare
      - run: cargo run --release --quiet -- check prelude/PROCESS.tsare

      # Default-deny .gitignore hides new files instead of reporting them.  This is the alarm.
      - name: nothing is untracked
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(git status --porcelain)"

      # A tracked file must not carry a fact about the machine it was written on.  A drive letter or
      # a home directory is wrong in every other checkout, and it is the kind of detail that gets
      # into a document once and then gets copied.  The SKILL shipped one; this is the alarm for it.
      - name: no machine paths
        if: matrix.os == 'ubuntu-latest'
        run: |
          if git grep -n -I -E '(^|[^[:alnum:]_])([A-Za-z]:\\|/Users/|/home/[a-z])' -- . ':!*.lock' ':!.github/**'; then
            echo 'a tracked file names a machine path; use a path relative to the repository root'
            exit 1
          fi

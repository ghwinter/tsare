name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release

      # The plugin is JavaScript the Rust tests cannot see; its own selftest is the only gate it
      # has, and it needs no install: a fake ctx and a fake checker are in the directory.
      - name: gate selftest
        if: matrix.os == 'ubuntu-latest'
        run: node dsh/tsare-gate/selftest.mjs

      # The documents the tests read are there, and they compile.  One per invocation on purpose:
      # `check DIR` merges a directory into one program, and the prelude files are separate worlds.
      - run: cargo run --release --quiet -- check SELF.tsare
      - run: cargo run --release --quiet -- check docs/REPO.tsare
      - run: cargo run --release --quiet -- check prelude/KERNEL.tsare
      - run: cargo run --release --quiet -- check prelude/WORLDVIEW.tsare
      - run: cargo run --release --quiet -- check prelude/PROCESS.tsare

      # Default-deny .gitignore hides new files instead of reporting them.  This is the alarm.
      - name: nothing is untracked
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(git status --porcelain)"

      # A tracked file must not carry a fact about the machine it was written on: a drive letter,
      # a home directory, a hostname, a private address, a port on one machine.  Those are wrong in
      # every other checkout, and they are the kind of detail that gets into a document once and
      # then gets copied.  `.github/` is exempt because the workflow itself writes a temp file.
      - name: no machine paths
        if: matrix.os == 'ubuntu-latest'
        run: |
          if git grep -n -I -E '(^|[^[:alnum:]_])([A-Za-z]:[\\/]|/Users/|/home/[a-z]|/root/|\\\\[A-Za-z0-9_.-]+\\|(127\.0\.0\.1|192\.168\.[0-9]+|10\.[0-9]+\.[0-9]+\.[0-9]+|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]+\.[0-9]+|localhost:[0-9]+))' -- . ':!*.lock' ':!.github/**'; then
            echo 'a tracked file names a machine path; use a path relative to the repository root'
            exit 1
          fi

      # A key in the tree is a key in every future clone.  Match the shapes that services issue,
      # not the words that describe them: `${{ secrets.NAME }}` is a reference and must pass.
      - name: no secrets
        if: matrix.os == 'ubuntu-latest'
        run: |
          if git grep -n -I -E '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|xox[baprs]-[A-Za-z0-9-]{10,}|AIza[0-9A-Za-z_-]{35})' -- . ':!*.lock'; then
            echo 'a tracked file contains something shaped like a secret'
            exit 1
          fi

      # A record of one run is noise in the tree and a fact about one machine.  The ignore list
      # hides it; this catches a forced add or a branch that still tracks it.
      - name: no large tracked files
        if: matrix.os == 'ubuntu-latest'
        run: |
          bad=""
          for file in $(git ls-files); do
            size=$(wc -c < "$file")
            if [ "$size" -gt 262144 ]; then
              bad="$bad$file ($size bytes)\n"
            fi
          done
          if [ -n "$bad" ]; then
            printf "$bad"
            echo 'a tracked file over 256 KiB is an artifact; generate it, link it, or keep it out'
            exit 1
          fi

      # The same rule the commit-msg hook applies, for a machine that never installed it.  Merge
      # and revert messages are exempt inside the hook.  A push range is validated when GitHub
      # reports one; a fresh branch falls back to the tip.
      - name: commit messages
        if: matrix.os == 'ubuntu-latest'
        run: |
          base="${{ github.event.before }}"
          case "$base" in ""|0000000*) range="-1" ;; *) range="$base..HEAD" ;; esac
          for sha in $(git rev-list $range); do
            git log -1 --format=%B "$sha" > /tmp/message
            if ! sh .githooks/commit-msg /tmp/message; then
              echo "commit $sha has a message that does not conform to CONTRIBUTING.md"
              exit 1
            fi
          done

      # One line per invocation, with the temp paths of the run: noise and local facts in one
      # file.  `.gitignore` keeps it out of an ordinary add; this catches a forced add, or a branch
      # that still tracks it, before a merge puts it back.
      - name: no regenerable matrix rows
        if: matrix.os == 'ubuntu-latest'
        run: |
          if git ls-files 'tests/fixtures/harden/artifacts/*.jsonl' | grep -q .; then
            git ls-files 'tests/fixtures/harden/artifacts/*.jsonl'
            echo 'matrix-*.jsonl is regenerable and full of local paths; keep it untracked'
            exit 1
          fi

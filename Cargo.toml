[package]
name = "tsare"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
description = "An external reasoning engine and language checker for LLMs: claims compile, and checkability has a deterministic answer."
license = "MIT"
readme = "README.md"
keywords = ["compiler", "logic", "argument", "verification", "reasoning"]
categories = ["development-tools", "text-processing"]
include = [
    "/src/**",
    "/tests/**",
    "/SELF.mf",
    "/docs/PROTOCOL.md",
    "/docs/REPO.mf",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[lib]
# the library keeps the short name, so `tsare::check` reads as it should
name = "tsare"

[[bin]]
name = "tsare"
path = "src/main.rs"


[workspace]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]






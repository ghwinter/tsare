[package]
name = "tsare"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "A reasoning engine for AI agents: it reads a claim written as code, decides whether it can be checked, and prints the smallest edit that would make it so."
license = "MIT"
readme = "README.md"
keywords = ["compiler", "logic", "argument", "verification", "reasoning"]
categories = ["development-tools", "text-processing"]
include = [
    "src/**",
    "tests/**",
    "examples/**",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[lib]
# the library keeps the short name, so `tsare::check` reads as it should
name = "tsare"

[[bin]]
name = "tsare"
path = "src/main.rs"


[workspace]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]





